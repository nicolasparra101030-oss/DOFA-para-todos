# Catálogo de sensores para DOFA para todos.
# Cada banda tiene: nombre (como aparece en el archivo), descripción y longitud de onda central en micrómetros (µm).
# Los valores son aproximados, tomados de las fichas técnicas de cada sensor; DOFA tolera diferencias pequeñas.
# Para agregar un sensor nuevo, copia un bloque y cambia los datos. No hace falta programar.

Sentinel-2 (L2A):
  descripcion: Satélite óptico de la ESA, 10 a 20 m de resolución. Imágenes gratuitas en Copernicus.
  bandas:
    - [B02, Azul, 0.49]
    - [B03, Verde, 0.56]
    - [B04, Rojo, 0.665]
    - [B05, Borde rojo 1, 0.705]
    - [B06, Borde rojo 2, 0.74]
    - [B07, Borde rojo 3, 0.783]
    - [B08, Infrarrojo cercano, 0.842]
    - [B8A, Infrarrojo cercano estrecho, 0.865]
    - [B11, Infrarrojo de onda corta 1, 1.61]
    - [B12, Infrarrojo de onda corta 2, 2.19]
    - [B01, Aerosoles (costero), 0.443]
    - [B09, Vapor de agua, 0.945]
  por_defecto: [B02, B03, B04, B05, B06, B07, B08, B11, B12]

Landsat 8 / 9 (OLI):
  descripcion: Satélites de la NASA y el USGS, 30 m de resolución. Imágenes gratuitas en EarthExplorer.
  bandas:
    - [B1, Aerosoles (costero), 0.443]
    - [B2, Azul, 0.482]
    - [B3, Verde, 0.561]
    - [B4, Rojo, 0.655]
    - [B5, Infrarrojo cercano, 0.865]
    - [B6, Infrarrojo de onda corta 1, 1.609]
    - [B7, Infrarrojo de onda corta 2, 2.201]
  por_defecto: [B2, B3, B4, B5, B6, B7]

Landsat 5 / 7 (TM / ETM+):
  descripcion: Satélites Landsat anteriores, 30 m de resolución. Útiles para series históricas.
  bandas:
    - [B1, Azul, 0.485]
    - [B2, Verde, 0.56]
    - [B3, Rojo, 0.66]
    - [B4, Infrarrojo cercano, 0.83]
    - [B5, Infrarrojo de onda corta 1, 1.65]
    - [B7, Infrarrojo de onda corta 2, 2.215]
  por_defecto: [B1, B2, B3, B4, B5, B7]

Sentinel-1 (radar):
  descripcion: Radar de la ESA; ve a través de las nubes. El valor 5.405 es el que usa el repositorio oficial de DOFA.
  radar: true
  bandas:
    - [VV, Polarización VV, 5.405]
    - [VH, Polarización VH, 5.405]
  por_defecto: [VV, VH]

