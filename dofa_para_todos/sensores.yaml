IKONOS:
  descripcion: Satélite comercial de alta resolución (1 a 4 m).
  bandas:
    - [Azul, Azul, 0.48]
    - [Verde, Verde, 0.551]
    - [Rojo, Rojo, 0.665]
    - [NIR, Infrarrojo cercano, 0.805]
  por_defecto: [Azul, Verde, Rojo, NIR]

Foto RGB (dron, aérea o satelital):
  descripcion: Cualquier imagen a color natural. Longitudes de onda aproximadas.
  bandas:
    - [Rojo, Rojo, 0.665]
    - [Verde, Verde, 0.56]
    - [Azul, Azul, 0.49]
  por_defecto: [Rojo, Verde, Azul]

Dron multiespectral (RGB + borde rojo + NIR):
  descripcion: Cámaras multiespectrales de dron de 5 bandas. Longitudes de onda aproximadas; revisa la ficha de tu cámara.
  bandas:
    - [Azul, Azul, 0.475]
    - [Verde, Verde, 0.56]
    - [Rojo, Rojo, 0.668]
    - [Borde rojo, Borde rojo, 0.717]
    - [NIR, Infrarrojo cercano, 0.842]
  por_defecto: [Azul, Verde, Rojo, Borde rojo, NIR]
